[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wxrisk"
version = "0.0.1"
description = "Ensemble-conditioned meteorological hazard risk index, video-codec analogy"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "numpy>=2,<3",
    "xarray>=2024.6",
    "zarr>=3.0",
    "dask>=2024.6",
    "fsspec>=2024.6",
    "gcsfs>=2024.6",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2,<3",
    "pyarrow>=18",
    "cdsapi>=0.7.7",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "shapely>=2.2.0",
    "pyshp>=3.1.6",
    "cfgrib>=0.9.15.1",
    "eccodes>=2.50.0",
    "pygrib>=2.1.8",
    "netcdf4>=1.7.5",
    "boto3>=1.43.118",
    "polars>=2.0.0",
    "duckdb>=2.0.0",
    "dataretrieval>=1.4.0",
    "optuna>=5.0.0",
]

[project.optional-dependencies]
torch = ["torch>=2.4,<3"]

[dependency-groups]
dev = [
    "ipykernel>=6,<8",
    "matplotlib>=3.8,<4",
    "pytest>=9.1.1",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wxrisk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
