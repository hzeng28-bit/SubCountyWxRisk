[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wxrisk"
version = "0.0.1"
description = "Ensemble-conditioned meteorological hazard risk index, video-codec analogy"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "numpy>=2,<3",
    "xarray>=2024.6",
    "zarr>=3.0",
    "dask>=2024.6",
    "fsspec>=2024.6",
    "gcsfs>=2024.6",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2,<3",
    "pyarrow>=18",
]

[project.optional-dependencies]
torch = ["torch>=2.4,<3"]

[dependency-groups]
dev = ["ipykernel>=6,<8", "matplotlib>=3.8,<4", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/wxrisk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
